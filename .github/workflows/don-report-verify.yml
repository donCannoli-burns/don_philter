name: Don Report Philter CLI build
on:
  pull_request:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
      - run: yarn install --frozen-lockfile
      - name: Preview exact ESLint autoformat (temporary)
        run: |
          ./node_modules/.bin/eslint packages/cli/src/index.ts packages/cli/src/don-report.ts packages/cli/src/verify-rules.ts tests/verify-rules.test.cjs --fix || true
          for file in packages/cli/src/index.ts packages/cli/src/don-report.ts packages/cli/src/verify-rules.ts tests/verify-rules.test.cjs; do
            echo "DONFMT_START:$file"
            cat "$file"
            echo "DONFMT_END:$file"
          done
      - name: Build report and original Philter CLI in isolation
        run: yarn run build:cli
      - name: Exercise compiled parser in synthetic no-action KoLmafia runtime
        run: node tests/verify-rules.test.cjs
      - name: Lint
        run: yarn run lint
