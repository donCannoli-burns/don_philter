name: Don Report Philter CLI build
on:
  pull_request:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
      - run: yarn install --frozen-lockfile
      - name: Preview ESLint autofix (temporary, no repository writeback)
        run: |
          ./node_modules/.bin/eslint packages/cli/src/don-report.ts --fix || true
          echo "DONFMT_START:packages/cli/src/don-report.ts"
          cat packages/cli/src/don-report.ts
          echo "DONFMT_END:packages/cli/src/don-report.ts"
      - name: Build report and original Philter CLI in isolation
        run: yarn run build:cli
      - name: Lint
        run: yarn run lint
